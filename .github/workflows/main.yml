name: Build ZIX Kernel (Surya)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - gaming

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: gaming
          path: kernel
          fetch-depth: 1

      - name: Setup Environment
        run: |
          sudo apt update
          sudo apt install -y git ccache automake flex lzop bison gperf \
            build-essential zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 libssl-dev bc wget

      - name: Clone Toolchain (AOSP Clang)
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android14-release clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android14-release gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b android14-release gcc32

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
          # Clean default files
          rm -rf AnyKernel3/.git
          rm -f AnyKernel3/README*
          rm -f AnyKernel3/anykernel.sh

      - name: Create AnyKernel3 Script
        run: |
          cat > AnyKernel3/anykernel.sh << 'EOF'
          # AnyKernel3 Ramdisk Script for ZIX Kernel (Surya)
          properties() { '
          kernel.string=ZIX Kernel | KernelSU-Next + SUSFS | Surya
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=surya
          device.name2=karna
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "ZIX Kernel for Surya / Karna";
          ui_print "KernelSU-Next + SUSFS";
          ui_print " ";

          dump_boot;

          write_boot;
          EOF

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Grok
          export KBUILD_BUILD_HOST=GitHub-Actions

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Use ccache
          export CC="ccache clang"
          export CXX="ccache clang++"
          ccache -M 5G

          # Defconfig
          make O=out ARCH=arm64 surya_defconfig || make O=out ARCH=arm64 defconfig

          # Build
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            2>&1 | tee build.log

      - name: Check Build Result
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Build successful!"
            ls -lh kernel/out/arch/arm64/boot/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz found"
          else
            echo "Build failed!"
            cat kernel/build.log | tail -100
            exit 1
          fi

      - name: Package AnyKernel3
        run: |
          cd AnyKernel3

          # Copy kernel image
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
          fi

          # Copy dtbo if exists
          if [ -f ../kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp ../kernel/out/arch/arm64/boot/dtbo.img .
          fi

          # Create zip
          zip -r9 ZIX-Kernel-Surya-KSUN-SUSFS-$(date +%Y%m%d).zip * -x .git\* README\*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIX-Kernel-Surya-KSUN-SUSFS
          path: AnyKernel3/*.zip
          retention-days: 7

      - name: Create Release (Optional)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/gaming' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: build-${{ github.run_number }}
          name: ZIX Kernel Surya - Build ${{ github.run_number }}
          body: |
            Automated build of ZIX Kernel for Surya
            - KernelSU-Next + SUSFS
            - Built on GitHub Actions
          files: AnyKernel3/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
